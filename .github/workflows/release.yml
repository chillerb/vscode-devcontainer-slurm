name: Release

# Bump "version" in package.json, commit, then push a matching tag:
#   git tag v0.1.0 && git push origin main v0.1.0
#
# Needs two repository secrets (Settings > Secrets and variables > Actions, or
# `gh secret set <NAME>`):
#   VSCE_PAT  Azure DevOps personal access token: dev.azure.com > User settings >
#             Personal access tokens > New token, Organization "All accessible
#             organizations", Scopes: Custom defined > Show all scopes >
#             Marketplace > Manage. The publisher "chillerb" must exist at
#             https://marketplace.visualstudio.com/manage.
#             Global PATs like this one stop working on 1 Dec 2026; publishing
#             then has to move to Entra ID (vsce publish --azure-credential),
#             see TODO.md.
#   OVSX_PAT  open-vsx.org > Settings > Access Tokens. Needs a linked Eclipse
#             account and the signed Publisher Agreement. The namespace must
#             exist first -- once, by hand:
#               npx ovsx create-namespace chillerb -p <OVSX_PAT>
#
# The two registries publish in separate jobs on purpose. Neither lets a
# version be republished, so if they shared a job, one failing would leave the
# other unretryable: re-running would hit "already exists" on the one that
# worked. Split, "Re-run failed jobs" retries only the one that failed.

on:
  push:
    tags: ['v*']

jobs:
  # Packaged once, published twice, so both registries serve the same bytes.
  # `vsce package` runs vscode:prepublish, the production build.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that does not match package.json would publish a different
      # version than the tag claims.
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx --yes @vscode/vsce package --out extension.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension.vsix
          if-no-files-found: error

  marketplace:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - run: npx --yes @vscode/vsce publish --packagePath extension.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  open-vsx:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      # --skip-duplicate so a re-run of this job is a no-op rather than an
      # error. vsce has no equivalent, which is why the split above matters.
      - run: npx --yes ovsx publish extension.vsix --skip-duplicate --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

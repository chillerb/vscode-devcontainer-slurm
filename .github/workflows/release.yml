name: Release

# Bump "version" in package.json, commit, then push a matching tag:
#   git tag v0.1.0 && git push origin main v0.1.0
#
# Publishes to the VS Code Marketplace only; Open VSX is planned (TODO.md).
# Needs the repository secret VSCE_PAT (Settings > Secrets and variables >
# Actions, or `gh secret set VSCE_PAT`): an Azure DevOps personal access token
# from dev.azure.com > User settings > Personal access tokens > New token,
# Organization "All accessible organizations", Scopes: Custom defined > Show
# all scopes > Marketplace > Manage. The publisher "chillerb" must exist at
# https://marketplace.visualstudio.com/manage.
# Global PATs like this one stop working on 1 Dec 2026; publishing then has to
# move to Entra ID (vsce publish --azure-credential), see TODO.md.
#
# Packaging and publishing are separate jobs, so "Re-run failed jobs" after a
# failed publish (e.g. an expired token) reuses the already built .vsix.

on:
  push:
    tags: ['v*']

jobs:
  # `vsce package` runs vscode:prepublish, the production build.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that does not match package.json would publish a different
      # version than the tag claims.
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx --yes @vscode/vsce package --out extension.vsix

      - name: Check the bundled extension loads
        run: npm run check-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension.vsix
          if-no-files-found: error

  marketplace:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - run: npx --yes @vscode/vsce publish --packagePath extension.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}


name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check-types

      - run: npm run lint

      # Plain mocha, no VS Code instance. The cluster-side scripts run against
      # fake sbatch/squeue/apptainer/sshd executables; the tests also need bash,
      # ssh and ssh-keygen, which the runner image provides. The integration
      # suite (npm test) is still the template placeholder, so it is not run
      # here yet -- see TODO.md.
      - name: Unit tests
        run: npm run test:unit

      # The same command the release runs, so a release cannot fail on
      # something CI accepted. It also validates the manifest (publisher,
      # semver version, icon, license).
      - name: Check the extension can be packaged
        run: npx --yes @vscode/vsce package --out /tmp/check.vsix

      # Loads the production bundle that was just built. The unit tests run the
      # unbundled tsc output, so they cannot see dependencies esbuild failed to
      # bundle -- which is how 0.1.0 shipped without working commands.
      - name: Check the bundled extension loads
        run: npm run check-bundle
